<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TiendaSonidoVivo.com</title>
    <link rel="stylesheet" href="gestionEstilos.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <header class="bg-dark text-white p-4">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="mb-0">Tienda Sonido Vivo</h1>
        <nav>
          <ul class="nav">
            <li class="nav-item">
              <a class="nav-link text-white" href="InicioGestion.html"
                >Inicio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white" href="gestionUsuarios.html"
                >Gestión de Usuarios</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container my-5">
      <h1 class="text-center mb-4">Gestión de Usuarios</h1>

      <div class="d-flex justify-content-end mb-3">
        <button
          class="btn btn-success"
          type="button"
          onclick="abrirModalAgregar()"
        >
          Añadir Usuario
        </button>
      </div>

      <div class="modal fade" id="modalUsuario" tabindex="-1">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalUsuarioTitulo">
                Añadir Usuario
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="indiceEdicion" value="-1" />
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" id="inputNombre" />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail" />
              </div>
              <div class="mb-3">
                <label class="form-label">Rol</label>
                <select class="form-select" id="inputRol">
                  <option value="Administrador">Administrador</option>
                  <option value="Vendedor">Vendedor</option>
                  <option value="Usuario">Usuario</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">Estado</label>
                <select class="form-select" id="inputEstado">
                  <option value="Activo">Activo</option>
                  <option value="Inactivo">Inactivo</option>
                </select>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button
                type="button"
                class="btn btn-primary"
                onclick="guardarUsuarioDesdeModal()"
              >
                Guardar
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-bordered">
          <thead class="table-dark">
            <tr>
              <th id="nombre">Nombre</th>
              <th id="email">Email</th>
              <th id="rol">Rol</th>
              <th id="estado">Estado</th>
              <th id="auditoria">Auditoría</th>
              <th id="acciones">Acciones</th>
            </tr>
          </thead>
          <tbody id="userTableBody"></tbody>
        </table>
      </div>
    </main>

    <footer class="bg-dark text-white text-center p-4 mt-5">
      <p class="mb-1 text-center">© 2026 Sonido Vivo - Viña del Mar</p>

      <small class="text-secondary">
        Contacto: tienda.sonido.vivo@gmail.cl | Teléfono: +56 9 5555 5555
      </small>
    </footer>

    <script src="gestionScript.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
